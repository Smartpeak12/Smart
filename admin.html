<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - SmartPeak Real Estate</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .form-section {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        body.dark-mode .form-section {
            background: #2a2a2a;
        }

        .form-section h2 {
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
        }

        body.dark-mode .form-group input,
        body.dark-mode .form-group select,
        body.dark-mode .form-group textarea {
            background: #333;
            color: #f5f5f5;
            border-color: #555;
        }

        .properties-list {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        body.dark-mode .properties-list {
            background: #2a2a2a;
        }

        .property-item {
            border: 1px solid #eee;
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        body.dark-mode .property-item {
            border-color: #444;
        }

        .property-item-info h3 {
            margin: 0;
        }

        .property-item-info p {
            margin: 0.5rem 0 0 0;
            color: #666;
        }

        body.dark-mode .property-item-info p {
            color: #aaa;
        }

        .property-item-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-edit, .btn-delete {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-edit {
            background: #6B46C1;
            color: white;
        }

        .btn-delete {
            background: #EC4899;
            color: white;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">🏠 SmartPeak Real Estate</div>
            <div class="nav-links">
                <a href="index.html">Back to Home</a>
            </div>
        </div>
    </nav>

    <div class="admin-container">
        <div class="admin-header">
            <h1>Admin Panel</h1>
            <button class="btn-primary" onclick="goHome()">← Back</button>
        </div>

        <!-- Add Property Form -->
        <div class="form-section">
            <h2>Add New Property</h2>
            <form onsubmit="handleAddProperty(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" id="title" required>
                    </div>
                    <div class="form-group">
                        <label>Price</label>
                        <input type="number" id="price" required min="0">
                    </div>
                    <div class="form-group">
                        <label>Type</label>
                        <select id="type" required>
                            <option value="sale">For Sale</option>
                            <option value="rent">For Rent</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Location</label>
                        <input type="text" id="location" required>
                    </div>
                    <div class="form-group">
                        <label>Bedrooms</label>
                        <input type="number" id="bedrooms" required min="1">
                    </div>
                    <div class="form-group">
                        <label>Bathrooms</label>
                        <input type="number" id="bathrooms" required min="1">
                    </div>
                    <div class="form-group">
                        <label>Square Feet</label>
                        <input type="number" id="sqft" required min="100">
                    </div>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;">Add Property</button>
            </form>
        </div>

        <!-- Properties List -->
        <div class="properties-list">
            <h2>Manage Properties</h2>
            <div id="properties-admin-list">
                <!-- Properties will be loaded here -->
            </div>
        </div>
    </div>

    <script src="dark-mode.js"></script>
    <script>
        let properties = JSON.parse(localStorage.getItem('properties')) || [
            {
                id: 1,
                title: "Modern Apartment",
                price: 250000,
                type: "sale",
                location: "Downtown",
                bedrooms: 2,
                bathrooms: 1,
                sqft: 1200,
                image: "🏢"
            },
            {
                id: 2,
                title: "Cozy Studio",
                price: 1200,
                type: "rent",
                location: "Midtown",
                bedrooms: 1,
                bathrooms: 1,
                sqft: 600,
                image: "🏠"
            },
            {
                id: 3,
                title: "Luxury Villa",
                price: 750000,
                type: "sale",
                location: "Suburbs",
                bedrooms: 4,
                bathrooms: 3,
                sqft: 3500,
                image: "🏡"
            },
            {
                id: 4,
                title: "Family Home",
                price: 1800,
                type: "rent",
                location: "Residential Area",
                bedrooms: 3,
                bathrooms: 2,
                sqft: 2000,
                image: "🏘️"
            }
        ];

        function initAdmin() {
            displayPropertiesAdmin();
        }

        function displayPropertiesAdmin() {
            const list = document.getElementById('properties-admin-list');
            list.innerHTML = '';

            properties.forEach(property => {
                const div = document.createElement('div');
                div.className = 'property-item';
                div.innerHTML = `
                    <div class="property-item-info">
                        <h3>${property.title}</h3>
                        <p>${property.location} • ${property.bedrooms} beds • ${property.type === 'sale' ? '$' + property.price : '$' + property.price + '/month'}</p>
                    </div>
                    <div class="property-item-actions">
                        <button class="btn-edit" onclick="editProperty(${property.id})">Edit</button>
                        <button class="btn-delete" onclick="deleteProperty(${property.id})">Delete</button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function handleAddProperty(event) {
            event.preventDefault();

            const newProperty = {
                id: Date.now(),
                title: document.getElementById('title').value,
                price: parseFloat(document.getElementById('price').value),
                type: document.getElementById('type').value,
                location: document.getElementById('location').value,
                bedrooms: parseInt(document.getElementById('bedrooms').value),
                bathrooms: parseInt(document.getElementById('bathrooms').value),
                sqft: parseInt(document.getElementById('sqft').value),
                image: '🏠'
            };

            properties.push(newProperty);
            localStorage.setItem('properties', JSON.stringify(properties));
            displayPropertiesAdmin();
            event.target.reset();
            alert('Property added successfully!');
        }

        function editProperty(id) {
            const property = properties.find(p => p.id === id);
            const title = prompt('Title:', property.title);
            if (title) {
                property.title = title;
                localStorage.setItem('properties', JSON.stringify(properties));
                displayPropertiesAdmin();
            }
        }

        function deleteProperty(id) {
            if (confirm('Are you sure you want to delete this property?')) {
                properties = properties.filter(p => p.id !== id);
                localStorage.setItem('properties', JSON.stringify(properties));
                displayPropertiesAdmin();
            }
        }

        function goHome() {
            window.location.href = 'index.html';
        }

        document.addEventListener('DOMContentLoaded', initAdmin);
    </script>
</body>
</html>
